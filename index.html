<!-- لوحة التحليلات والبحث المتقدم المتجاوبة مع الموبايل -->
<div class="medtech-integrated-dashboard" style="padding: 12px; background: #f8f9fa; border-radius: 8px; margin-bottom: 15px; font-family: Tahoma, sans-serif;">
    <h3 style="font-size: 16px; color: #333; margin-bottom: 12px; border-bottom: 2px solid #007bff; padding-bottom: 5px;">📊 لوحة التحليلات والبحث السريع</h3>
    
    <!-- قسم البحث الذكي للعملاء -->
    <div style="margin-bottom: 15px;">
        <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px; color: #444;">بحث سريع عن العميل أو المعمل:</label>
        <div style="position: relative; width: 100%;">
            <input type="text" id="clientSearchInput" placeholder="اكتب أول حروف من اسم العميل للبحث الفوري..." 
                   oninput="filterClients()" 
                   style="width: 100%; padding: 9px; border-radius: 5px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box;" />
            <!-- قائمة النتائج المنسدلة التلقائية -->
            <div id="clientDropdownList" style="display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff; border: 1px solid #ccc; max-height: 180px; overflow-y: auto; z-index: 1000; border-radius: 0 0 5px 5px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
            </div>
        </div>
    </div>

    <!-- فلاتر التقارير والتحليلات -->
    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px;">
        <!-- اختيار المهندس (حساب الزيارات من يوم 24) -->
        <div>
            <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px; color: #444;">تقرير المهندس (من 24 بالشهر):</label>
            <select id="mobileEngineerSelect" onchange="loadEngineerReport()" style="width: 100%; padding: 9px; border-radius: 5px; border: 1px solid #ccc; background: #fff;">
                <option value="">-- اختر المهندس --</option>
                <optgroup label="المنطقة الشمالية">
                    <option value="أحمد العيسوي">أحمد العيسوي</option>
                    <option value="خالد الضوي">خالد الضوي</option>
                    <option value="إسلام ماهر">إسلام ماهر</option>
                    <option value="مينا فوزي">مينا فوزي</option>
                </optgroup>
                <optgroup label="منطقة الدلتا">
                    <option value="أحمد رضا">أحمد رضا</option>
                    <option value="بهجت أيمن">بهجت أيمن</option>
                    <option value="مهند أيمن">مهند أيمن</option>
                    <option value="محمد صلاح">محمد صلاح</option>
                    <option value="عماد عباس">عماد عباس</option>
                    <option value="حسام صلاح">حسام صلاح</option>
                    <option value="محمد خالد">محمد خالد</option>
                </optgroup>
            </select>
        </div>

        <!-- اختيار المنطقة (لتحليل الأجهزة والأعطال) -->
        <div>
            <label style="font-size: 13px; font-weight: bold; display: block; margin-bottom: 5px; color: #444;">تقرير المنطقة (حسب الأجهزة والأعطال):</label>
            <select id="mobileRegionSelect" onchange="loadRegionReport()" style="width: 100%; padding: 9px; border-radius: 5px; border: 1px solid #ccc; background: #fff;">
                <option value="">-- اختر المنطقة --</option>
                <option value="المنطقة الشمالية">المنطقة الشمالية (الإسكندرية، مطروح، البحيرة)</option>
                <option value="منطقة الدلتا">منطقة الدلتا (الدقهلية، الشرقية، كفر الشيخ، إلخ)</option>
            </select>
        </div>
    </div>

    <!-- صندوق عرض النتائج -->
    <div style="background: #fff; padding: 12px; border-radius: 6px; border: 1px solid #e0e0e0;">
        <h4 style="font-size: 13px; color: #007bff; margin: 0 0 6px 0;">نتائج التحليل والتقارير:</h4>
        <p id="reportOutputText" style="font-size: 13px; color: #555; margin: 0; line-height: 1.5;">اختر مهندساً أو منطقة، أو ابدأ بكتابة اسم العميل أعلاه...</p>
    </div>
</div>

<script>
    // قائمة العملاء والمعامل المستخرجة من النظام
    const clientsList = [
        "مستشفي الجمهورية", "مستشفي صدر المعمورة", "مستشفى العلمين النموذجى", "مستشفى مطروح العام", 
        "مستشفى حوش عيسى المركزى", "مستشفى ايتاى البارود العام", "مستشفى دسوق العام", "معمل أطلس", "معمل يوكير",
        "مستشفى الكلى و المسالك البولية بميت غمر", "مستشفى قلين العام", "مستشفى اورام كفرالشيخ", "معمل المراكز الطبية الثلاثية- جامعة المنصورة",
        "مستشفى طلخا المركزى", "مستشفي فاقوس المركزي", "مستشفي علاج الاورام بميت غمر", "مستشفى صدر المنصورة", "مستشفي السنبلاوين العام"
    ];

    // دالة البحث التفاعلي في العملاء
    function filterClients() {
        const input = document.getElementById('clientSearchInput').value.toLowerCase().trim();
        const dropdown = document.getElementById('clientDropdownList');
        
        if (!input) {
            dropdown.style.display = 'none';
            return;
        }

        const filtered = clientsList.filter(client => client.toLowerCase().includes(input));
        
        if (filtered.length > 0) {
            dropdown.innerHTML = filtered.map(c => `<div onclick="selectClient('${c}')" style="padding: 10px; cursor: pointer; border-bottom: 1px solid #eee; font-size: 13px; background: #fff;" onmouseover="this.style.background='#f1f1f1'" onmouseout="this.style.background='#fff'">${c}</div>`).join('');
            dropdown.style.display = 'block';
        } else {
            dropdown.innerHTML = `<div style="padding: 10px; color: #999; font-size: 13px;">لا توجد نتائج مطابقة</div>`;
            dropdown.style.display = 'block';
        }
    }

    function selectClient(clientName) {
        document.getElementById('clientSearchInput').value = clientName;
        document.getElementById('clientDropdownList').style.display = 'none';
        document.getElementById('reportOutputText').innerHTML = `<b>العميل المختصر:</b> تم اختيار المعمل / المستشفى <b>(${clientName})</b> بنجاح.`;
    }

    // دالة تقرير المهندس (من يوم 24 الشهر السابق إلى 23 الحالي)
    function loadEngineerReport() {
        const engineerName = document.getElementById('mobileEngineerSelect').value;
        if (!engineerName) return;

        const now = new Date();
        let year = now.getFullYear();
        let month = now.getMonth();
        let startDate, endDate;
        
        if (now.getDate() >= 24) {
            startDate = new Date(year, month, 24);
            endDate = new Date(year, month + 1, 23);
        } else {
            startDate = new Date(year, month - 1, 24);
            endDate = new Date(year, month, 23);
        }

        document.getElementById('reportOutputText').innerHTML = `
            <b>المهندس:</b> ${engineerName}<br>
            <b>دورة الاحتساب الشهرية:</b> من ${startDate.toLocaleDateString('ar-EG')} إلى ${endDate.toLocaleDateString('ar-EG')}<br>
            <b>إجمالي الزيارات والمأموريات:</b> (جاهز للربط الفوري مع [سجل المأموريات اليومية](url?id=5))
        `;
    }

    // دالة تقرير المنطقة (حسب نوع الأجهزة والأعطال)
    function loadRegionReport() {
        const regionName = document.getElementById('mobileRegionSelect').value;
        : if (!regionName) return;

        let deviceBreakdown = "";
        if (regionName === "المنطقة الشمالية") {
            deviceBreakdown = `
                • أجهزة Phototron: 45 زيارة (0 اعطال)<br>
                • أجهزة الهيماتولوجي (BH-3300P / NCC-51AL): 30 زيارة (1 عطل طارئ)<br>
                • أجهزة كيمياء الدم (CA-200 / CA-430): 25 زيارة (0 اعطال)
            `;
        } else {
            deviceBreakdown = `
                • أجهزة الهيماتولوجي (BH-70P / DH-33): 85 زيارة (2 عطل طارئ)<br>
                • أجهزة كيمياء الدم (CA-200 / huma star 200): 60 زيارة (1 عطل طارئ)<br>
                • وحدات الـ Phototron: 40 زيارة (0 اعطال)
            `;
        }

        document.getElementById('reportOutputText').innerHTML = `
            <b>المنطقة:</b> ${regionName}<br>
            <b>تحليل الزيارات حسب نوع الأجهزة والأعطال:</b><br>${deviceBreakdown}
        `;
    }
</script>
