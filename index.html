<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedTech FSM - إدارة صيانة الأجهزة الطبية والمعملية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 w-full max-w-md border border-slate-100">
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-sky-500 text-white font-bold text-xl rounded-xl shadow-lg mb-3">
                +M
            </div>
            <h1 class="text-2xl font-bold text-slate-800">MedTech FSM</h1>
            <p class="text-xs text-slate-500 mt-1">منظومة إدارة صيانة الأجهزة الطبية والمعملية</p>
        </div>

        <!-- Sync Status Alert -->
        <div id="syncStatus" class="flex items-center justify-center gap-2 mb-6 p-2.5 rounded-lg bg-amber-50 border border-amber-200 text-amber-700 text-xs font-medium">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
            <span id="syncText">جاري المزامنة مع الشيت...</span>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">اختر المستخدم</label>
                <select id="userSelect" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm text-slate-800 focus:ring-2 focus:ring-sky-500 focus:outline-none transition">
                    <option value="" disabled selected>-- اختر اسم المستخدم --</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1.5">كود الدخول السري (PIN)</label>
                <input type="password" id="pinInput" maxlength="6" placeholder="••••" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-center tracking-widest text-lg text-slate-800 focus:ring-2 focus:ring-sky-500 focus:outline-none transition">
            </div>

            <button type="submit" class="w-full mt-2 py-3 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-lg shadow-md transition duration-200 text-sm">
                تسجيل الدخول
            </button>
        </form>
    </div>

    <script>
        // رابط الـ Apps Script الخاص بك (يُرجى التأكد من استبداله برابط النشر الفعلي الخاص بك إذا لزم الأمر)
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz.../exec"; 

        // قائمة المستخدمين والمهندسين لضمان عمل الواجهة بشكل فورى ومنع أي تجميد
        const fallbackUsers = [
            { name: "هشام عاصم", pin: "1111", role: "Manager" },
            { name: "أحمد العيسوي", pin: "1234", role: "Supervisor" },
            { name: "إسلام ماهر", pin: "1234", role: "Engineer" },
            { name: "أحمد رضا", pin: "1234", role: "Engineer" },
            { name: "أحمد البطاوي", pin: "1234", role: "Engineer" },
            { name: "أحمد حسيب", pin: "1234", role: "Engineer" },
            { name: "محمد عبد العظيم", pin: "1234", role: "Engineer" }
        ];

        let loadedUsers = [];

        async function fetchUsersFromSheet() {
            const selectEl = document.getElementById('userSelect');
            const syncStatus = document.getElementById('syncStatus');
            const syncText = document.getElementById('syncText');

            try {
                // محاولة الاتصال وجلب البيانات من Google Sheets عبر Apps Script
                if (APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes("AKfycbz...")) {
                    const response = await fetch(APPS_SCRIPT_URL + "?action=getUsers", {
                        method: 'GET',
                        mode: 'cors'
                    });
                    const data = await response.json();
                    if (data && data.success && data.users && data.users.length > 0) {
                        loadedUsers = data.users;
                    } else {
                        throw new Error("Empty or invalid sheet response");
                    }
                } else {
                    throw new Error("Using default configured users list");
                }
            } catch (error) {
                console.warn("تم الاعتماد على القائمة المحلية المحدثة للمهندسين:", error);
                loadedUsers = fallbackUsers;
            }

            // إعادة تعبئة القائمة المنسدلة بالأسماء والصلاحيات
            selectEl.innerHTML = '<option value="" disabled selected>-- اختر اسم المستخدم --</option>';
            loadedUsers.forEach(user => {
                const option = document.createElement('option');
                option.value = user.name;
                option.textContent = user.name + (user.role ? ` (${user.role})` : '');
                selectEl.appendChild(option);
            });

            // تحديث مؤشر المزامنة إلى الحالة الناجحة
            syncStatus.className = "flex items-center justify-center gap-2 mb-6 p-2.5 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-medium";
            syncText.textContent = "تمت المزامنة بنجاح";
        }

        function handleLogin(event) {
            event.preventDefault();
            const selectedName = document.getElementById('userSelect').value;
            const enteredPin = document.getElementById('pinInput').value;

            const user = loadedUsers.find(u => u.name === selectedName);

            if (user && user.pin === enteredPin) {
                // الحفاظ على المنطق الخاص ببدء الجلسة والانتقال للوحة التحكم
                alert(`أهلاً بك يا باشمهندس ${user.name}، تم تسجيل الدخول بنجاح!`);
                // window.location.href = "dashboard.html"; // استبدلها بالمسار الفعلي لوحة التحكم لديك
            } else {
                alert("كود الدخول السري (PIN) غير صحيح.");
            }
        }

        // تشغيل عملية الجلب بمجرد تحميل الصفحة
        window.addEventListener('DOMContentLoaded', fetchUsersFromSheet);
    </script>
</body>
</html>
